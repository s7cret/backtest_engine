[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "backtest-engine"
version = "4.0.0"
description = "Independent deterministic bar-by-bar strategy backtest engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MoltBot"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/s7cret/backtest_engine"
Repository = "https://github.com/s7cret/backtest_engine"
Issues = "https://github.com/s7cret/backtest_engine/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "pinelib @ git+https://github.com/s7cret/pinelib.git@33239a0093fa5d548058d79d5d079104db0ef43e",
  "marketdata-provider @ git+https://github.com/s7cret/marketdata-provider.git@ae95042ee482feb82d87a51484658fdb031dd0d5",
]

[project.scripts]
backtest = "backtest_engine.cli.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
backtest_engine = ["py.typed"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
allow_untyped_defs = true


[tool.coverage.run]
source = ["backtest_engine"]

[tool.coverage.report]
fail_under = 100
show_missing = true
