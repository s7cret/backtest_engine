name: Verify causal price-entry brackets before publication
'on':
  push:
    branches: ['ops/rc6-price-exits-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: reviewed-rc6-price-exits
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/backtest_engine
          ref: 36625c6c230dbe7b30724863b22188db6a48559f
          path: publisher-source
          sparse-checkout: .github/exit-review/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Reuse the reviewed exact-commit publisher with this maintenance ref
        run: |
          cp publisher-source/.github/exit-review/restore.py "$RUNNER_TEMP/restore.py"
          python - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'restore.py'
          text = path.read_text()
          assert text.count("STAGING = 'ops/rc6-exits-20260906'") == 1
          path.write_text(text.replace("STAGING = 'ops/rc6-exits-20260906'", "STAGING = 'ops/rc6-price-exits-20260906'"))
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact reviewed source tree and commit
        run: |
          cat .github/price-exits/part1.patch .github/price-exits/part2.patch > .github/price-exits/01.patch
          python "$RUNNER_TEMP/restore.py" restore .github/price-exits/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install exact sibling sources and a clean engine copy
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import os, pathlib, subprocess, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sources'
          root.mkdir()
          pins={'openpine-contracts':'d1382d1c0a1f867cc184016d8ac670a9264a7938','pinelib':'cddaa0bf2324db36b4cd29e944a251032658c59d','marketdata-provider':'4e269bb7e3d389cae6214da9e17898c32c7ead15'}
          paths=[]
          for name, sha in pins.items():
              path=root/name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              assert subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()==sha
              paths.append(str(path))
          clean=root/'engine';clean.mkdir()
          subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','archive','HEAD']),check=True)
          subprocess.run(['python','-m','pip','install',*paths,str(clean)+'[dev]'],check=True)
          (root.parent/'evidence/source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          PY
      - name: Full broker suite including causal and magnifier regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/backtest_engine.xml"
      - name: Changed-file lint and clean wheel/sdist builds
        run: |
          python -m ruff check backtest_engine/core/price_events.py backtest_engine/core/fill_scanner.py backtest_engine/core/native_run_loop.py backtest_engine/core/deferred_exits.py backtest_engine/core/strategy_capabilities.py backtest_engine/core/strategy_command_processor.py tests/unit/test_pending_price_exits.py tests/unit/test_deferred_market_exits.py
          python -m compileall -q backtest_engine
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/sources/engine"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-exits-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: price-exits-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward verified RC6 and archive only this temporary branch
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-exits-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
