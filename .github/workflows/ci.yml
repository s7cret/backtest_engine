name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: 6b5e67445e2772057cd877e158c7aa0c58bdfe37
          path: stack/openpine-contracts
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: de1cb68be33a9b51ee6ddf2513932c90af721874
          path: stack/marketdata-provider
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: 1204d02ed5cea1a3be8b5e8252bc4d881c539a25
          path: stack/pinelib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          printf 'stack/\n' >> .git/info/exclude
          python -m pip install -U pip
          python -m pip install -e ./stack/openpine-contracts
          python -m pip install -e ./stack/marketdata-provider
          python -m pip install -e ./stack/pinelib
          python -m pip install -e '.[dev]'
          mkdir -p "$RUNNER_TEMP/stack-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/openpine-contracts
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/marketdata-provider
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/pinelib
      - name: Release gate
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/openpine_contracts-*.whl)"
          OPENPINE_MARKETDATA_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/marketdata_provider-*.whl)"
          OPENPINE_PINELIB_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/pinelib-*.whl)"
          PYTHON=python bash scripts/release_gate.sh
