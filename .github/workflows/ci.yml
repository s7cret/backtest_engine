name: CI

on:
  push:
    branches: [main, release/5.0.0rc6]
  pull_request:
    branches: [main, release/5.0.0rc6]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: db1745756516b47466756c9c5d38fbbb95595a3b
          path: stack/openpine-contracts
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: 27b70c361076cf2b6a1bea7cd2dea650ab791584
          path: stack/marketdata-provider
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: f66c67f90a7f3428fe68267d41de9ae31202f775
          path: stack/pinelib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify supported CPython and GIL
        run: |
          python - <<'PY'
          import platform
          import sys
          import sysconfig
          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.python_implementation() == "CPython"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED"), "free-threaded builds are unsupported"
          assert sys._is_gil_enabled(), "GIL must be enabled"
          PY
      - name: Install
        run: |
          printf 'stack/\n' >> .git/info/exclude
          python -m pip install -U pip
          python -m pip install -e ./stack/openpine-contracts
          python -m pip install -e ./stack/marketdata-provider
          python -m pip install -e ./stack/pinelib
          python -m pip install -e '.[dev]'
          mkdir -p "$RUNNER_TEMP/stack-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/openpine-contracts
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/marketdata-provider
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./stack/pinelib
      - name: Release gate
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/openpine_contracts-*.whl)"
          OPENPINE_MARKETDATA_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/marketdata_provider-*.whl)"
          OPENPINE_PINELIB_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/pinelib-*.whl)"
          PYTHON=python bash scripts/release_gate.sh
