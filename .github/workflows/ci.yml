name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: 91c405e759206b542d22df242ef55ac49b1f0bb4
          path: openpine-contracts
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: 99426a3a684589e1ba5b69d1a2316d1d77b86cd2
          path: marketdata-provider
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: 7e681f3ce2945d2ba702833b1f82aa4da133d909
          path: pinelib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ./openpine-contracts
          python -m pip install -e ./marketdata-provider
          python -m pip install -e ./pinelib
          python -m pip install -e '.[dev]'
          mkdir -p "$RUNNER_TEMP/stack-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./openpine-contracts
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./marketdata-provider
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./pinelib
      - name: Release gate
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/openpine_contracts-*.whl)"
          OPENPINE_MARKETDATA_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/marketdata_provider-*.whl)"
          OPENPINE_PINELIB_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/pinelib-*.whl)"
          PYTHON=python bash scripts/release_gate.sh
