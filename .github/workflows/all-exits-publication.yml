name: Verify all-entry lifetimes and per-fill brackets before publication
'on':
  push:
    branches: ['ops/rc6-all-exits-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-all-exits-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: d4775540f22bac26d7ba607187c633e0c4159f69
          path: publisher-source
          sparse-checkout: .github/all-exits/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/all-exits/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact reviewed source and verify patch/tree/commit identities
        run: |
          cat .github/all-exits/parts/01.txt .github/all-exits/parts/02.txt .github/all-exits/parts/03.txt .github/all-exits/parts/04.txt .github/all-exits/parts/05.txt > .github/all-exits/01.patch
          python "$RUNNER_TEMP/restore.py" restore .github/all-exits/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install exact dependencies and reviewed engine
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stack'
          root.mkdir()
          pins={'openpine-contracts':'7c20559e87b3f2342adb0b849d4239c133567f0a','pinelib':'cddaa0bf2324db36b4cd29e944a251032658c59d','marketdata-provider':'4e269bb7e3d389cae6214da9e17898c32c7ead15'}
          sources=[]
          for name, sha in pins.items():
              path=root/name
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+name+'.git',str(path)],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()!=sha:
                  raise SystemExit('Dependency source identity mismatch')
              sources.append(str(path))
          clean=root/'engine-source'
          clean.mkdir()
          subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','archive','HEAD']),check=True)
          subprocess.run(['python','-m','pip','install',*sources,str(clean)+'[dev]'],check=True)
          (root.parent/'evidence/source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          PY
      - name: Complete broker suite including native resume and lifetime tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/backtest_engine.xml"
      - name: Check every changed Python source and build distributions
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          plan=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence/plan.json').read_text())
          paths=subprocess.check_output(['git','diff','--name-only',plan['base'],'HEAD'],text=True).splitlines()
          subprocess.run(['python','-m','ruff','check',*[p for p in paths if p.endswith('.py')]],check=True)
          PY
          python -m compileall -q backtest_engine
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/stack/engine-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-exits-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: all-exits-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward verified RC6 and preserve temporary delivery history
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-exits-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
