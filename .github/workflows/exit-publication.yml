name: Verify explicit market brackets and exit reservations
'on':
  push:
    branches: ['ops/rc6-exits-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-exit-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact source commits
        run: |
          cp .github/exit-review/restore.py "$RUNNER_TEMP/restore.py"
          python "$RUNNER_TEMP/restore.py" restore .github/exit-review/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install pinned siblings and clean reviewed source
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'dependencies'
          root.mkdir()
          pins = {'openpine-contracts':'d1382d1c0a1f867cc184016d8ac670a9264a7938','pinelib':'cddaa0bf2324db36b4cd29e944a251032658c59d','marketdata-provider':'4e269bb7e3d389cae6214da9e17898c32c7ead15'}
          paths = []
          for repo, sha in pins.items():
              source = root/repo
              subprocess.run(['git','clone','--quiet','https://github.com/s7cret/'+repo+'.git',str(source)],check=True)
              subprocess.run(['git','-C',str(source),'checkout','--detach',sha],check=True)
              if subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()!=sha:
                  raise SystemExit('Source identity mismatch')
              paths.append(str(source)+('[parquet,stream,zstd]' if repo=='marketdata-provider' else ''))
          clean = root/'engine'
          clean.mkdir()
          subprocess.run(['tar','-x','-C',str(clean)],input=subprocess.check_output(['git','archive','HEAD']),check=True)
          subprocess.run(['python','-m','pip','install',*paths,str(clean)+'[dev]'],check=True)
          (root.parent/'evidence/source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          PY
      - name: Complete broker functional suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/backtest_engine.xml"
      - name: Source checks and wheel/sdist build
        run: |
          python -m ruff check backtest_engine tests/unit/test_deferred_market_exits.py tests/unit/test_exit_replacement_scope.py tests/unit/test_strategy_host_surface.py
          python -m compileall -q backtest_engine
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/dependencies/engine"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exits-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: exits-3.13-${{ github.run_id }}
          path: evidence
      - name: Publish verified source and archive this temporary branch
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exits-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
